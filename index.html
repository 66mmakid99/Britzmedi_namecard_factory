<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRITZMEDI Business Card Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #111116;
      --main: #B8A978; /* 색감 보정: 조금 더 화사한 골드 */
      --accent: #E4D8AA;
      --light: #FDF4D8;
      --muted: #9A9070;
      --line: rgba(184, 169, 120, 0.25);
      --line-light: rgba(184, 169, 120, 0.12);
      --text-dim: #7B7560;
      --text-body: #D4C89A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', 'Segoe UI', -apple-system, sans-serif;
      background: #050508;
      color: #E8E0D0;
      min-height: 100vh;
      padding: 36px 20px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 44px;
    }
    .header-tag {
      font-size: 9px;
      letter-spacing: 7px;
      color: var(--main);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: 4px;
      color: var(--light);
    }
    .header-line {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--main), transparent);
      margin: 14px auto;
    }
    .header p {
      font-size: 12px;
      color: #555;
      font-weight: 300;
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      color: #555;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 400;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .tab-btn:hover { border-color: rgba(168, 153, 104, 0.3); color: var(--muted); }
    .tab-btn.active {
      background: rgba(184, 169, 120, 0.18);
      border-color: #B8A978;
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 15px rgba(184,169,120,0.1);
    }
    .dept-group {
      width: 100%;
      margin-bottom: 24px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(184, 169, 120, 0.1);
      border-radius: 10px;
      text-align: left;
    }
    .dept-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dept-label::after {
      content: ''; flex: 1; height: 1px; background: var(--line-light);
    }
    .tab-row {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 6px 14px;
      background: rgba(184, 169, 120, 0.03);
      border: 1px solid rgba(184, 169, 120, 0.15);
      border-radius: 6px;
      flex: 0 1 auto;
      text-align: center;
      min-width: 100px;
    }
    .tab-btn:hover {
      background: rgba(184, 169, 120, 0.08);
      border-color: rgba(184, 169, 120, 0.4);
    }

    /* Card - 94x54mm ratio (with 2mm bleed) */
    .card-face {
      width: 540px;
      height: 310px;
      border-radius: 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.4s ease;
    }
    .card-face:hover { transform: scale(1.02); }

    /* Trim line overlay */
    .trim-guide {
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 1px dashed rgba(255,255,255,0.12);
      pointer-events: none;
      z-index: 10;
    }
    .trim-corner {
      position: absolute;
      width: 8px; height: 8px;
      border-color: rgba(168,153,104,0.35);
      pointer-events: none;
      z-index: 10;
    }
    .trim-corner.tl { top: 8px; left: 8px; border-top: 1px solid; border-left: 1px solid; border-color: inherit; }
    .trim-corner.tr { top: 8px; right: 8px; border-top: 1px solid; border-right: 1px solid; border-color: inherit; }
    .trim-corner.bl { bottom: 8px; left: 8px; border-bottom: 1px solid; border-left: 1px solid; border-color: inherit; }
    .trim-corner.br { bottom: 8px; right: 8px; border-bottom: 1px solid; border-right: 1px solid; border-color: inherit; }

    /* Preview area */
    .preview { display: flex; justify-content: center; margin-bottom: 24px; }
    .face-toggle {
      display: inline-flex;
      gap: 4px;
      background: #111;
      border-radius: 6px;
      padding: 3px;
      margin-bottom: 24px;
    }
    .face-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 500;
      transition: all 0.3s;
      font-family: inherit;
    }
    .face-btn.active {
      background: rgba(168, 153, 104, 0.15);
      color: var(--accent);
    }

    /* Design info */
    .design-info {
      text-align: center;
      margin-bottom: 48px;
    }
    .design-info .name { font-size: 13px; color: var(--accent); font-weight: 500; letter-spacing: 1px; margin-bottom: 4px; }
    .design-info .desc { font-size: 12px; color: #555; font-weight: 300; max-width: 500px; margin: 0 auto; }

    /* Print spec */
    .print-spec {
      text-align: center;
      margin: -8px 0 16px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #383828;
    }
    .print-spec span { color: #555040; }

    /* Action buttons */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0 24px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: 1px solid rgba(168,153,104,0.3);
      background: rgba(168,153,104,0.06);
      color: #A89968;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .action-btn:hover {
      background: rgba(168,153,104,0.15);
      border-color: rgba(168,153,104,0.5);
      color: #D4C89A;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary {
      background: rgba(168,153,104,0.15);
      border-color: rgba(168,153,104,0.4);
      color: #D4C89A;
    }
    .action-btn .icon { font-size: 13px; }

    /* All cards grid */
    .all-section {
      border-top: 1px solid #151515;
      padding-top: 36px;
    }
    .all-title { font-size: 9px; letter-spacing: 5px; color: #444; text-align: center; margin-bottom: 28px; }
    .all-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px 15px;
    }
    .all-item { text-align: center; cursor: pointer; transition: transform 0.3s; }
    .all-item:hover { transform: translateY(-5px); }
    .all-item .card-face { text-align: left; }
    .all-item .card-face {
      width: 280px;
      height: 160px;
      margin: 0 auto 8px;
    }
    .all-item .card-face .trim-guide {
      top: 8px; left: 8px; right: 8px; bottom: 8px;
    }
    .all-item .card-face .trim-corner.tl { top: 5px; left: 5px; }
    .all-item .card-face .trim-corner.tr { top: 5px; right: 5px; }
    .all-item .card-face .trim-corner.bl { bottom: 5px; left: 5px; }
    .all-item .card-face .trim-corner.br { bottom: 5px; right: 5px; }
    .all-item .card-face:hover { transform: scale(1.04); }
    .all-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #444;
      font-weight: 400;
      margin-top: 6px;
    }

    /* Card Inner Styles */
    .card-bg-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    }
    .card-content {
      padding: 32px 36px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .card-name-kr {
      font-size: 17px; font-weight: 300; letter-spacing: 2px; color: var(--light); margin-bottom: 4px;
    }
    .card-title {
      font-size: 7.5px; letter-spacing: 3px; color: var(--main); font-weight: 500;
    }
    .card-info {
      font-size: 8px; color: var(--text-dim); letter-spacing: 0.5px; line-height: 1.8;
    }
    .card-separator {
      width: 1px; height: 24px; background: var(--line-light);
    }

    /* Logo text with gradient */
    .logo-text-gradient {
      background: linear-gradient(135deg, #A89968, #D4C89A 35%, #EDE4C8 55%, #D4C89A 75%, #A89968);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Footer */
    .footer {
      text-align: center; font-size: 9px; letter-spacing: 4px; color: #282828;
      margin-top: 48px; padding-top: 20px; border-top: 1px solid #111;
    }

    /* Print styles */
    @media print {
      body { background: white; padding: 10mm; }
      .header, .tabs, .face-toggle, .design-info, .footer, .all-section { display: none; }
      .preview { page-break-inside: avoid; }
      .card-face { box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    }

    /* Animation */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card-face { animation: fadeIn 0.5s ease; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-tag">BRITZMEDI · PLATINUM GOLD</div>
      <h1>BUSINESS CARD DESIGN</h1>
      <div class="header-line"></div>
      <p>플래티넘 골드 명함 — 직원별 개별 제작</p>
    </div>

    <!-- Person Tabs -->
    <div class="tabs" id="personTabs"></div>

    <!-- Front/Back & Theme Toggle -->
    <div style="display:flex; justify-content:center; gap:20px; margin-bottom: 30px;">
      <div class="face-toggle">
        <button class="face-btn active" id="btn-front" onclick="toggleFace('front')">FRONT</button>
        <button class="face-btn" id="btn-back" onclick="toggleFace('back')">BACK</button>
      </div>
      <div class="face-toggle theme-toggle">
        <button class="face-btn active" id="theme-black" onclick="toggleTheme('black')">BLACK</button>
        <button class="face-btn" id="theme-white" onclick="toggleTheme('white')">WHITE</button>
      </div>
    </div>

    <!-- Main Preview -->
    <div class="preview" id="mainPreview"></div>

    <!-- Design Info -->
    <div class="design-info">
      <div class="name" id="designName"></div>
      <div class="desc" id="designDesc"></div>
    </div>

    <!-- Print Spec -->
    <div class="print-spec">
      TRIM <span>90×50mm</span> · BLEED <span>2mm</span> · TOTAL <span>94×54mm</span> · <span>---- 절단선</span>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button class="action-btn primary" onclick="downloadCurrentPDF(event)">
        <span class="icon">📄</span> PDF (인쇄용)
      </button>
      <button class="action-btn" onclick="downloadCurrentPNG(event)">
        <span class="icon">🖼️</span> PNG (이미지)
      </button>
      <button class="action-btn" onclick="downloadCurrentSVG(event)">
        <span class="icon">📐</span> SVG (벡터)
      </button>
      <button class="action-btn" onclick="downloadAllPDF(event)">
        <span class="icon">📦</span> 전체 PDF
      </button>
      <button class="action-btn" onclick="downloadExcelTemplate(event)">
        <span class="icon">📋</span> 엑셀 양식
      </button>
      <label class="action-btn" style="margin:0">
        <span class="icon">📂</span> 엑셀 불러오기
        <input type="file" accept=".xlsx,.xls" onchange="importExcel(event)" style="display:none">
      </label>
      <button class="action-btn" onclick="resetData()" style="opacity:0.6; border-style:dashed;">
        <span class="icon">🔄</span> 초기화
      </button>
    </div>

    <!-- All Cards -->
    <div class="all-section">
      <div class="all-title">ALL EMPLOYEES — FRONT &amp; BACK</div>
      <div class="all-grid" id="allGrid"></div>
    </div>

    <!-- Footer -->
    <div class="footer">BRITZMEDI · PLATINUM GOLD · BUSINESS CARD</div>
  </div>

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { try { employees = JSON.parse(saved); } catch(e) { console.error("Load failed", e); } }
    }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); }
    function resetData() {
      if (confirm('모든 데이터를 초기화하고 기본 목록으로 되돌리시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }


    function getThemeColors() {
      if (currentTheme === 'white') {
        return {
          bg: '#FFFFFF',
          nameKr: '#111111',
          titleKr: '#6A5D35',
          nameEn: '#444444',
          titleEn: '#666666',
          address: '#222222',
          highlight: '#70643E',
          sub: '#555555',
          line: '#948454',
          overlay: 'radial-gradient(ellipse at 80% 20%, rgba(184,169,120,0.12) 0%, transparent 60%)'
        };
      }
      return {
        bg: '#111116',
        nameKr: '#FDF4D8',
        titleKr: '#B8A978',
        nameEn: '#9a9070',
        titleEn: '#7a7260',
        address: '#8B8570',
        highlight: '#D4C89A',
        sub: '#7a7260',
        line: '#B8A978',
        overlay: 'radial-gradient(ellipse at 80% 20%, rgba(26,26,34,0.06) 0%, transparent 50%)'
      };
    }

    // ─── Card Generators ───

    function frontCard(p, id, size) {
      const w = size === 'small' ? 370 : 540;
      const h = size === 'small' ? 212 : 310;
      const s = size === 'small' ? 0.685 : 1;
      const bleed = size === 'small' ? 8 : 12;
      const logoW = Math.round(52 * s);
      const logoH = Math.round(56 * s);
      const c = getThemeColors();
      const trimColor = currentTheme === 'white' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.12)';
      const cornerColor = currentTheme === 'white' ? 'rgba(168,153,104,0.6)' : 'rgba(168,153,104,0.35)';

      return `
        <div class="card-face" style="width:${w}px;height:${h}px;background:${c.bg};color:${c.sub}">
          <!-- Trim guides -->
          <div class="trim-guide" style="border-color:${trimColor}"></div>
          <div class="trim-corner tl" style="color:${cornerColor}"></div>
          <div class="trim-corner tr" style="color:${cornerColor}"></div>
          <div class="trim-corner bl" style="color:${cornerColor}"></div>
          <div class="trim-corner br" style="color:${cornerColor}"></div>
          <div class="card-bg-overlay" style="background:${c.overlay}"></div>
          <div style="position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,${c.line}66,transparent)"></div>

          <div class="card-content" style="padding:${size==='small'?(bleed+8)+'px '+(bleed+12)+'px ':(bleed+14)+'px '+(bleed+20)+'px '};height:100%;position:relative;">
            <div style="display:flex;align-items:flex-start;gap:${Math.round(14*s)}px">
              <div style="flex-shrink:0;margin-top:${Math.round(6*s)}px">
                ${makeLogo(logoW, logoH, 'front-'+id)}
              </div>
              <div style="margin-top:${Math.round(2*s)}px">
                <div style="display:flex;align-items:baseline;gap:${Math.round(8*s)}px;margin-bottom:${Math.round(5*s)}px">
                  <span style="font-size:${Math.round(24*s)}px;font-weight:500;letter-spacing:2px;color:${c.nameKr}">${p.nameKr}</span>
                  <span style="font-size:${Math.round(11*s)}px;font-weight:400;letter-spacing:1.5px;color:${c.titleKr}">${p.titleKr}</span>
                </div>
                <div style="display:flex;align-items:baseline;gap:${Math.round(8*s)}px">
                  <span style="font-size:${Math.round(11*s)}px;font-weight:400;letter-spacing:0.8px;color:${c.nameEn}">${p.nameEn}</span>
                  <span style="font-size:${Math.round(9*s)}px;letter-spacing:${size==='small'?'0.8px':'1.2px'};color:${c.titleEn};font-weight:400">${p.titleEn}</span>
                </div>
              </div>
            </div>

            <div style="position:absolute;left:${size==='small'?(bleed+16):(bleed+24)}px;right:${size==='small'?(bleed+16):(bleed+24)}px;bottom:${size==='small'?(bleed+22):(bleed+34)}px;">
              <div style="font-size:${Math.round(9.5*s)}px;color:${c.address};letter-spacing:0.3px;line-height:1.5;margin-bottom:${Math.round(5*s)}px">
                <div>${p.addressKr}</div>
                <div>${p.addressEn}</div>
              </div>
              <div style="width:${Math.round(28*s)}px;height:1px;background:linear-gradient(90deg,${c.line},${c.line}40);margin-bottom:${Math.round(5*s)}px"></div>
              <div style="display:flex;gap:${Math.round(24*s)}px;align-items:flex-start">
                <div style="font-size:${Math.round(10*s)}px;color:${c.sub};letter-spacing:0.3px;line-height:${size==='small'?'1.5':'1.65'}">
                  <div style="color:${c.highlight}">${p.phone}</div>
                  <div>${p.tel}</div>
                  <div>${p.fax}</div>
                </div>
                <div style="width:1px;height:${Math.round(40*s)}px;background:${c.line}40"></div>
                <div style="font-size:${Math.round(10*s)}px;color:${c.sub};letter-spacing:0.3px;line-height:${size==='small'?'1.5':'1.65'}">
                  <div style="color:${c.highlight}">${p.email}</div>
                  <div>${p.website}</div>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function backCard(p, id, size) {
      const w = size === 'small' ? 370 : 540;
      const h = size === 'small' ? 212 : 310;
      const s = size === 'small' ? 0.685 : 1;
      const symW = Math.round(72 * s);
      const symH = Math.round(65 * s);
      const c = getThemeColors();
      const trimColor = currentTheme === 'white' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.12)';
      const cornerColor = currentTheme === 'white' ? 'rgba(168,153,104,0.6)' : 'rgba(168,153,104,0.35)';

      return `
        <div class="card-face" style="width:${w}px;height:${h}px;background:${c.bg};">
          <!-- Trim guides -->
          <div class="trim-guide" style="border-color:${trimColor}"></div>
          <div class="trim-corner tl" style="color:${cornerColor}"></div>
          <div class="trim-corner tr" style="color:${cornerColor}"></div>
          <div class="trim-corner bl" style="color:${cornerColor}"></div>
          <div class="trim-corner br" style="color:${cornerColor}"></div>
          <div class="card-bg-overlay" style="background:radial-gradient(ellipse at 50% 50%, ${currentTheme==='white'?'rgba(168,153,104,0.06)':'rgba(184,169,120,0.04)'} 0%, transparent 60%)"></div>

          <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1">
            ${makeSymbol(symW, symH, 'back-'+id)}
            <div style="font-size:${Math.round(13*s)}px;letter-spacing:8px;color:${c.titleKr};margin-top:${Math.round(12*s)}px;font-weight:500">BRITZMEDI</div>
            <div style="width:${Math.round(44*s)}px;height:1px;background:linear-gradient(90deg,transparent,${c.line},transparent);margin:${Math.round(6*s)}px 0"></div>
            <div style="font-size:${Math.round(9*s)}px;letter-spacing:5px;color:${c.muted};font-weight:400">AESTHETIC MEDICAL DEVICE</div>
          </div>
        </div>`;
    }

    // ─── Rendering ───

    function renderTabs() {
      const tabs = document.getElementById('personTabs');
      
      // Group by department
      const groups = {};
      employees.forEach((e, i) => {
        const d = e.dept || 'Etc';
        if (!groups[d]) groups[d] = [];
        groups[d].push({ ...e, originalIndex: i });
      });

      // Sort within group by rank
      Object.keys(groups).forEach(d => {
        groups[d].sort((a,b) => {
          const rA = RANK_ORDER[a.titleKr] || 99;
          const rB = RANK_ORDER[b.titleKr] || 99;
          return rA - rB;
        });
      });

      tabs.innerHTML = Object.keys(groups).sort().map(d => `
        <div class="dept-group">
          <div class="dept-label">${d}</div>
          <div class="tab-row">
            ${groups[d].map(e => `
              <button class="tab-btn ${e.originalIndex === currentPerson ? 'active' : ''}" onclick="selectPerson(${e.originalIndex})">
                <div style="font-weight:500; font-size:11px; margin-bottom:1px;">${e.nameKr}</div>
                <div style="font-size:8.5px; opacity:0.6;">${e.titleKr}</div>
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderPreview() {
      const preview = document.getElementById('mainPreview');
      const p = employees[currentPerson];
      if (currentFace === 'front') {
        preview.innerHTML = frontCard(p, 'main-' + currentPerson, 'large');
      } else {
        preview.innerHTML = backCard(p, 'main-' + currentPerson, 'large');
      }

      document.getElementById('designName').textContent = `${p.nameKr} — ${p.titleKr} / ${p.titleEn}`;
      document.getElementById('designDesc').textContent = `${p.email} · ${p.phone} · 신청수량: ${p.qty}매`;
    }

    function renderAllCards() {
      const grid = document.getElementById('allGrid');
      grid.innerHTML = employees.map((p, i) => `
        <div class="all-item" onclick="selectPerson(${i})">
          ${frontCard(p, 'all-f-' + i, 'small')}
          <div style="height:12px"></div>
          ${backCard(p, 'all-b-' + i, 'small')}
          <div class="all-label" style="color:${i === currentPerson ? '#D4C89A' : '#444'};font-weight:${i === currentPerson ? 600 : 400};margin-top:14px">
            ${p.nameKr} · ${p.titleKr}
          </div>
        </div>
      `).join('');
    }

    function selectPerson(idx) {
      currentPerson = idx;
      renderTabs();
      renderPreview();
      renderAllCards();
    }

    function toggleFace(face) {
      currentFace = face;
      document.getElementById('btn-front').classList.toggle('active', face === 'front');
      document.getElementById('btn-back').classList.toggle('active', face === 'back');
      renderPreview();
    }

    function toggleTheme(theme) {
      currentTheme = theme;
      document.getElementById('theme-black').classList.toggle('active', theme === 'black');
      document.getElementById('theme-white').classList.toggle('active', theme === 'white');
      renderPreview();
      renderAllCards();
    }

    // Initial render
    function init() {
      loadData();
      renderTabs();
      renderPreview();
      renderAllCards();
    }
    init();

      } else {

        return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
          <rect width="100%" height="100%" fill="${c.bg}"/>
          <rect x="0" y="309" width="${w}" height="1" fill="${c.line}" opacity="0.4"/>
          <g transform="translate(${leftPadding}, 30)">
            ${makeLogo(logoW, logoH, 'v-f')}
          </g>
          <g transform="translate(${leftPadding + 66}, 56)">
            <text x="0" y="0" font-family="${font}" font-size="24" font-weight="500" letter-spacing="2" fill="${c.nameKr}">${p.nameKr}</text>
            <text x="${titleX}" y="-4" font-family="${font}" font-size="11" font-weight="400" letter-spacing="1.5" fill="${c.titleKr}">${p.titleKr}</text>
            <text x="0" y="24" font-family="${font}" font-size="11" font-weight="400" letter-spacing="0.8" fill="${c.nameEn}">${p.nameEn}</text>
            <text x="${titleX}" y="24" font-family="${font}" font-size="9" font-weight="400" letter-spacing="1.2" fill="${c.titleEn}">${p.titleEn}</text>
          </g>
          <g transform="translate(${leftPadding + 4}, 205)">
            <text x="0" y="0" font-family="${font}" font-size="9.5" fill="${c.address}">${p.addressKr}</text>
            <text x="0" y="15" font-family="${font}" font-size="9.5" fill="${c.address}">${p.addressEn}</text>
            <rect x="0" y="26" width="28" height="1" fill="${c.line}"/>
            <g transform="translate(0, 48)">
              <text x="0" y="0" font-family="${font}" font-size="10" fill="${c.highlight}">${p.phone}</text>
              <text x="0" y="15" font-family="${font}" font-size="10" fill="${c.sub}">${p.tel}</text>
              <text x="0" y="30" font-family="${font}" font-size="10" fill="${c.sub}">${p.fax}</text>
              <line x1="165" y1="-8" x2="165" y2="34" stroke="${c.line}" stroke-opacity="0.4"/>
              <text x="180" y="0" font-family="${font}" font-size="10" fill="${c.highlight}">${p.email}</text>
              <text x="180" y="15" font-family="${font}" font-size="10" fill="${c.sub}">${p.website}</text>
            </g>
          </g>
        </svg>`;
      }
    }

    async function svgToCanvas(svgStr) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 540 * 4; 
        canvas.height = 310 * 4;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(svgBlob);
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas);
        };
        img.src = url;
      });
    }

    async function downloadCurrentPDF(event) {
      const btn = event.currentTarget;
      const origText = btn.innerHTML;
      btn.innerHTML = '<span class="icon">⏳</span>'; btn.disabled = true;
      try {
        const { jsPDF } = window.jspdf;
        const p = employees[currentPerson];
        const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:[94, 54] });

        const frontSvg = generateVectorSVG(p, false);
        const frontCanvas = await svgToCanvas(frontSvg);
        pdf.addImage(frontCanvas.toDataURL('image/png'), 'PNG', 0, 0, 94, 54, undefined, 'NONE');

        pdf.addPage([94, 54], 'landscape');
        const backSvg = generateVectorSVG(p, true);
        const backCanvas = await svgToCanvas(backSvg);
        pdf.addImage(backCanvas.toDataURL('image/png'), 'PNG', 0, 0, 94, 54, undefined, 'NONE');

        pdf.save(`BRITZMEDI_Card_${p.nameKr}.pdf`);
      } catch(e) { console.error(e); alert('PDF 생성 실패'); }
      btn.innerHTML = origText; btn.disabled = false;
    }

    async function downloadCurrentPNG(event) {
      const btn = event.currentTarget;
      const origText = btn.innerHTML;
      btn.innerHTML = '<span class="icon">⏳</span>'; btn.disabled = true;
      try {
        const p = employees[currentPerson];
        const isBack = currentFace === 'back';
        const svg = generateVectorSVG(p, isBack);
        const canvas = await svgToCanvas(svg);
        const link = document.createElement('a');
        link.download = `BRITZMEDI_${isBack?'Back':'Front'}_${p.nameKr}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch(e) { console.error(e); alert('PNG 생성 실패'); }
      btn.innerHTML = origText; btn.disabled = false;
    }

    async function downloadCurrentSVG(event) {
      const btn = event.currentTarget;
      const origText = btn.innerHTML;
      btn.innerHTML = '<span class="icon">⏳</span>'; btn.disabled = true;
      try {
        const p = employees[currentPerson];
        const isBack = currentFace === 'back';
        const svgOut = generateVectorSVG(p, isBack);
        const blob = new Blob([svgOut], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `BRITZMEDI_${isBack?'Back':'Front'}_${p.nameKr}.svg`;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      } catch(e) { console.error(e); alert('SVG 생성 실패'); }
      btn.innerHTML = origText; btn.disabled = false;
    }

    async function downloadAllPDF(event) {
      const btn = event.currentTarget;
      const origText = btn.innerHTML;
      btn.disabled = true;
      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:[94, 54] });

        for (let i = 0; i < employees.length; i++) {
          btn.innerHTML = `<span class="icon">⏳</span> ${i+1}/${employees.length}`;
          const p = employees[i];
          
          if (i > 0) pdf.addPage([94, 54], 'landscape');
          const frontSvg = generateVectorSVG(p, false);
          const frontCanvas = await svgToCanvas(frontSvg);
          pdf.addImage(frontCanvas.toDataURL('image/png'), 'PNG', 0, 0, 94, 54, undefined, 'NONE');

          pdf.addPage([94, 54], 'landscape');
          const backSvg = generateVectorSVG(p, true);
          const backCanvas = await svgToCanvas(backSvg);
          pdf.addImage(backCanvas.toDataURL('image/png'), 'PNG', 0, 0, 94, 54, undefined, 'NONE');
        }

        pdf.save('BRITZMEDI_Cards_Full.pdf');
      } catch(e) {
        console.error(e);
        alert('PDF 생성 실패');
      }
      btn.innerHTML = origText;
      btn.disabled = false;
    }

    // ─── Excel Template ───

    function downloadExcelTemplate() {
      const headers = ['부서', '이름(국문)', '이름(영문)', '직함(국문)', '직함(영문)', '휴대폰', '이메일', '전화', '팩스', '웹사이트', '주소(국문)', '주소(영문)', '수량'];

      const data = employees.map(p => [
        p.dept || '', p.nameKr, p.nameEn, p.titleKr, p.titleEn,
        p.phone, p.email, p.tel, p.fax, p.website,
        p.addressKr, p.addressEn, p.qty
      ]);

      const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
      ws['!cols'] = [
        {wch:12},{wch:12},{wch:20},{wch:14},{wch:30},
        {wch:16},{wch:24},{wch:16},{wch:16},{wch:20},
        {wch:40},{wch:60},{wch:8}
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '명함리스트');
      XLSX.writeFile(wb, 'BRITZMEDI_명함양식.xlsx');
    }

    function importExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const wb = XLSX.read(e.target.result, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1});

          // Skip header row
          const newEmployees = [];
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            var rowNameKr = String(r[1] || '').trim();
            var rowNameEn = String(r[2] || '').trim();
            
            // Critical check: use En as fallback if Kr is empty
            if (!rowNameKr && !rowNameEn) continue; 
            if (!rowNameKr) rowNameKr = rowNameEn;

            newEmployees.push({
              dept: String(r[0] || 'Etc').trim(),
              nameKr: rowNameKr,
              nameEn: rowNameEn,
              titleKr: String(r[3] || '').trim(),
              titleEn: String(r[4] || '').trim(),
              phone: String(r[5] || '').trim(),
              email: (String(r[6] || '') + (r[7] ? ' / ' + r[7] : '')).trim(),
              tel: String(r[8] || '').trim(),
              fax: String(r[9] || '').trim(),
              website: (String(r[10] || '') + (r[11] ? ' / ' + r[11] : '')).trim(),
              addressKr: String(r[12] || '').trim(),
              addressEn: String(r[13] || '').trim(),
              qty: Number(r[14]) || 200
            });
          }

          if (newEmployees.length === 0) {
            alert('유효한 명함 데이터(이름 등)를 찾을 수 없습니다. 새로운 엑셀 양식을 다운로드하여 작성해 주세요.');
            return;
          }

          employees.length = 0;
          newEmployees.forEach(function(emp) { employees.push(emp); });
          saveData();
          currentPerson = 0;
          currentFace = 'front';
          renderTabs();
          renderPreview();
          renderAllCards();
          alert(`${newEmployees.length}명의 명함이 불러와졌으며 자동으로 저장되었습니다.`);
        } catch(err) {
          console.error(err);
          alert('엑셀 파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }
  </script>
