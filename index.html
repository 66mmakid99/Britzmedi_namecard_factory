<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[v1.5] BRITZMEDI Business Card Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@2.2.3/dist/svg2pdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #111116;
      --main: #B8A978; /* 색감 보정: 조금 더 화사한 골드 */
      --accent: #E4D8AA;
      --light: #FDF4D8;
      --muted: #9A9070;
      --line: rgba(184, 169, 120, 0.25);
      --line-light: rgba(184, 169, 120, 0.12);
      --text-dim: #7B7560;
      --text-body: #D4C89A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', 'Segoe UI', -apple-system, sans-serif;
      background: #050508;
      color: #E8E0D0;
      min-height: 100vh;
      padding: 36px 20px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 44px;
    }
    .header-tag {
      font-size: 9px;
      letter-spacing: 7px;
      color: var(--main);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: 4px;
      color: var(--light);
    }
    .header-line {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--main), transparent);
      margin: 14px auto;
    }
    .header p {
      font-size: 12px;
      color: #555;
      font-weight: 300;
      margin-bottom: 24px;
    }

    /* Mode Toggle */
    .mode-toggle {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }
    .mode-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(184, 169, 120, 0.2);
      border-radius: 30px;
      padding: 10px 24px;
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .mode-btn.active {
      background: var(--main);
      color: #000;
      border-color: var(--main);
      box-shadow: 0 4px 15px rgba(184,169,120,0.3);
    }
    .mode-btn:hover:not(.active) {
      border-color: var(--main);
      color: var(--main);
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 36px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      color: #555;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 400;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .tab-btn:hover { border-color: rgba(168, 153, 104, 0.3); color: var(--muted); }
    .tab-btn.active {
      background: rgba(184, 169, 120, 0.18);
      border-color: #B8A978;
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 15px rgba(184,169,120,0.1);
    }
    .dept-group {
      width: 100%;
      margin-bottom: 24px;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(184, 169, 120, 0.1);
      border-radius: 10px;
      text-align: left;
    }
    .dept-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dept-label::after {
      content: ''; flex: 1; height: 1px; background: var(--line-light);
    }
    .tab-row {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 6px 14px;
      background: rgba(184, 169, 120, 0.03);
      border: 1px solid rgba(184, 169, 120, 0.15);
      border-radius: 6px;
      flex: 0 1 auto;
      text-align: center;
      min-width: 100px;
    }
    .tab-btn:hover {
      background: rgba(184, 169, 120, 0.08);
      border-color: rgba(184, 169, 120, 0.4);
    }

    /* Envelope Specific */
    .envelope-container {
      position: relative;
      margin: 0 auto 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .envelope-preview {
      background: #fff;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .envelope-dieline-view {
      transform: scale(0.65);
      transform-origin: top center;
    }
    .dieline-label {
      position: absolute;
      font-size: 9px;
      color: #ff3b30;
      font-weight: bold;
      pointer-events: none;
      text-transform: uppercase;
    }
    .env-size-toggle {
      display: flex;
      gap: 6px;
      margin-top: 15px;
    }

    /* Card - 94x54mm ratio (with 2mm bleed) */
    .card-face {
      width: 540px;
      height: 310px;
      border-radius: 0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.4s ease;
    }
    .card-face:hover { transform: scale(1.02); }

    /* Trim line overlay */
    .trim-guide {
      position: absolute;
      top: 12px; left: 12px; right: 12px; bottom: 12px;
      border: 1px dashed rgba(255,255,255,0.12);
      pointer-events: none;
      z-index: 10;
    }
    .trim-corner {
      position: absolute;
      width: 8px; height: 8px;
      border-color: rgba(168,153,104,0.35);
      pointer-events: none;
      z-index: 10;
    }
    .trim-corner.tl { top: 8px; left: 8px; border-top: 1px solid; border-left: 1px solid; border-color: inherit; }
    .trim-corner.tr { top: 8px; right: 8px; border-top: 1px solid; border-right: 1px solid; border-color: inherit; }
    .trim-corner.bl { bottom: 8px; left: 8px; border-bottom: 1px solid; border-left: 1px solid; border-color: inherit; }
    .trim-corner.br { bottom: 8px; right: 8px; border-bottom: 1px solid; border-right: 1px solid; border-color: inherit; }

    /* Preview area */
    .preview { display: flex; justify-content: center; margin-bottom: 24px; }
    .face-toggle {
      display: inline-flex;
      gap: 4px;
      background: #111;
      border-radius: 6px;
      padding: 3px;
      margin-bottom: 24px;
    }
    .face-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 6px 16px;
      cursor: pointer;
      color: #555;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 500;
      transition: all 0.3s;
      font-family: inherit;
    }
    .face-btn.active {
      background: rgba(168, 153, 104, 0.15);
      color: var(--accent);
    }

    /* Design info */
    .design-info {
      text-align: center;
      margin-bottom: 48px;
    }
    .design-info .name { font-size: 13px; color: var(--accent); font-weight: 500; letter-spacing: 1px; margin-bottom: 4px; }
    .design-info .desc { font-size: 12px; color: #555; font-weight: 300; max-width: 500px; margin: 0 auto; }

    /* Print spec */
    .print-spec {
      text-align: center;
      margin: -8px 0 16px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #383828;
    }
    .print-spec span { color: #555040; }

    /* Action buttons */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0 24px;
      flex-wrap: wrap;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border: 1px solid rgba(168,153,104,0.3);
      background: rgba(168,153,104,0.06);
      color: #A89968;
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
    }
    .action-btn:hover {
      background: rgba(168,153,104,0.15);
      border-color: rgba(168,153,104,0.5);
      color: #D4C89A;
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary {
      background: rgba(168,153,104,0.15);
      border-color: rgba(168,153,104,0.4);
      color: #D4C89A;
    }
    .action-btn .icon { font-size: 13px; }

    /* All cards grid */
    .all-section {
      border-top: 1px solid #151515;
      padding-top: 36px;
    }
    .all-title { font-size: 9px; letter-spacing: 5px; color: #444; text-align: center; margin-bottom: 28px; }
    .all-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px 15px;
    }
    .all-item { text-align: center; cursor: pointer; transition: transform 0.3s; }
    .all-item:hover { transform: translateY(-5px); }
    .all-item .card-face { text-align: left; }
    .all-item .card-face {
      width: 280px;
      height: 160px;
      margin: 0 auto 8px;
    }
    .all-item .card-face .trim-guide {
      top: 8px; left: 8px; right: 8px; bottom: 8px;
    }
    .all-item .card-face .trim-corner.tl { top: 5px; left: 5px; }
    .all-item .card-face .trim-corner.tr { top: 5px; right: 5px; }
    .all-item .card-face .trim-corner.bl { bottom: 5px; left: 5px; }
    .all-item .card-face .trim-corner.br { bottom: 5px; right: 5px; }
    .all-item .card-face:hover { transform: scale(1.04); }
    .all-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: #444;
      font-weight: 400;
      margin-top: 6px;
    }

    /* Card Inner Styles */
    .card-bg-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    }
    .card-content {
      padding: 32px 36px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .card-name-kr {
      font-size: 17px; font-weight: 300; letter-spacing: 2px; color: var(--light); margin-bottom: 4px;
    }
    .card-title {
      font-size: 7.5px; letter-spacing: 3px; color: var(--main); font-weight: 500;
    }
    .card-info {
      font-size: 8px; color: var(--text-dim); letter-spacing: 0.5px; line-height: 1.8;
    }
    .card-separator {
      width: 1px; height: 24px; background: var(--line-light);
    }

    /* Logo text with gradient */
    .logo-text-gradient {
      background: linear-gradient(135deg, #A89968, #D4C89A 35%, #EDE4C8 55%, #D4C89A 75%, #A89968);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Footer */
    .footer {
      text-align: center; font-size: 9px; letter-spacing: 4px; color: #282828;
      margin-top: 48px; padding-top: 20px; border-top: 1px solid #111;
    }

    /* Print styles */
    @media print {
      body { background: white; padding: 10mm; }
      .header, .tabs, .face-toggle, .design-info, .footer, .all-section { display: none; }
      .preview { page-break-inside: avoid; }
      .card-face { box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
    }

    /* Animation */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card-face { animation: fadeIn 0.5s ease; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-tag">BRITZMEDI STATIONERY FACTORY</div>
      <h1>STATIONERY BUILDER</h1>
      <div class="header-line"></div>
      <p>Premium Corporate Identity Generator v1.6.0</p>

      <div class="mode-toggle">
        <button class="mode-btn active" onclick="switchMode('card')">BUSINESS CARD</button>
        <button class="mode-btn" onclick="switchMode('envelope')">DOCUMENT ENVELOPE</button>
      </div>
    </div>

    <!-- Person Selection -->
    <div id="personTabs" class="tabs"></div>

    <!-- Theme Selection -->
    <div class="tabs">
      <button class="face-btn active" id="theme-black" onclick="setTheme('black')">BLACK / GOLD</button>
      <button class="face-btn" id="theme-white" onclick="setTheme('white')">WHITE / GOLD</button>
    </div>

    <!-- Main Preview Area -->
    <div class="preview-section" id="cardPreviewSection">
      <div style="text-align:center">
        <div class="face-toggle">
          <button class="face-btn active" id="face-front" onclick="setFace('front')">FRONT (앞면)</button>
          <button class="face-btn" id="face-back" onclick="setFace('back')">BACK (뒷면)</button>
        </div>
      </div>
      
      <div class="preview" id="mainPreview"></div>
      
      <div class="print-spec" id="printSpec">
        SIZE: <span>90 x 50mm</span> (Bleed: 94 x 54mm) · 300DPI · CMYK READY
      </div>
    </div>

    <!-- Envelope Preview Area (Hidden by default) -->
    <div class="preview-section" id="envelopePreviewSection" style="display:none">
      <div style="text-align:center">
        <div class="face-toggle">
          <button class="face-btn active" id="face-fold" onclick="setEnvView('fold')">FOLDED (완성형)</button>
          <button class="face-btn" id="face-flat" onclick="setEnvView('flat')">DIELINE (칼선도면)</button>
        </div>
        <div class="env-size-toggle">
            <button class="face-btn active" id="env-a4" onclick="setEnvSize('A4')">A4 DOC (245x330)</button>
            <button class="face-btn" id="env-dl" onclick="setEnvSize('DL')">DL LETTER (220x110)</button>
        </div>
      </div>
      
      <div class="envelope-container">
        <div id="envelopePreview" class="envelope-preview"></div>
      </div>
    </div>

    <!-- Design Info -->
    <div class="design-info">
      <div class="name" id="designName"></div>
      <div class="desc" id="designDesc"></div>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
      <button class="action-btn primary" onclick="downloadCurrentPDF(event)">
        <span class="icon">📄</span> PDF (인쇄용)
      </button>
      <button class="action-btn" onclick="downloadCurrentPNG(event)">
        <span class="icon">🖼️</span> PNG (이미지)
      </button>
      <button class="action-btn" onclick="downloadCurrentSVG(event)">
        <span class="icon">📐</span> SVG (벡터)
      </button>
      <button class="action-btn" onclick="downloadAllPDF(event)">
        <span class="icon">📦</span> 전체 PDF
      </button>
      <button class="action-btn" onclick="downloadExcelTemplate(event)">
        <span class="icon">📋</span> 엑셀 양식
      </button>
      <label class="action-btn" style="margin:0">
        <span class="icon">📂</span> 엑셀 불러오기
        <input type="file" accept=".xlsx,.xls" onchange="importExcel(event)" style="display:none">
      </label>
      <button class="action-btn" onclick="hardReset()" style="border-color:#ff4444; color:#ff8888; opacity:0.8;">
        <span class="icon">⚠️</span> 디자인 초기화 (Hard Reset)
      </button>
    </div>

    <!-- All Cards -->
    <div class="all-section">
      <div class="all-title">ALL EMPLOYEES — FRONT &amp; BACK</div>
      <div class="all-grid" id="allGrid"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      BRITZMEDI · PLATINUM GOLD · BUSINESS CARD<br>
      <span style="opacity:0.3; font-size:8px; margin-top:8px; display:block;">LAYOUT VERSION: 1.6.0 (Stationery Builder)</span>
    </div>
  </div>

  <script>
    // ─── Constants & State ───
    var STORAGE_KEY = 'britzmedi_employees';
    var RANK_ORDER = { '대표이사':1, '이사':2, '영업이사':3, '부문장':4, '과장':5, '대리':6, '사원':7 };

    var currentPerson = 0;
    var currentFace = 'front';
    var currentTheme = 'black';
    var currentMode = 'card'; // 'card' or 'envelope'
    var currentEnvSize = 'A4'; // 'A4' or 'DL'
    var currentEnvView = 'fold'; // 'fold' or 'flat'

    const ENVELOPE_SPECS = {
      'A4': { w: 245, h: 330, flap: 45, wing: 15, bleed: 3 }, // Dimensions in mm
      'DL': { w: 220, h: 110, flap: 35, wing: 12, bleed: 3 }
    };
    var employees = [
      { dept: "Management", nameKr: "이성호", nameEn: "Lee Sungho", titleKr: "홈뷰티 부문장", titleEn: "Head of Home Beauty Devices", phone: "010-6525-9442", email: "sh.lee@britzmedi.co.kr", tel: "070-4348-7244", fax: "070-4009-8993", website: "www.britzmedi.co.kr", addressKr: "경기도 성남시 중원구 둔촌대로 388 (상대원동, 크란츠 테크노), 1211호", addressEn: "1211 ho, 388, Dunchon-daero, Jungwon-gu, Seongnam-si, Gyeonggi-do, Republic of Korea", qty: 200 },
      { dept: "Management", nameKr: "김남호", nameEn: "Kim Nam Ho", titleKr: "영업이사", titleEn: "Sales Director", phone: "010-8762-1142", email: "nh.kim@britzmedi.co.kr", tel: "070-4348-7244", fax: "070-4009-8993", website: "www.britzmedi.co.kr", addressKr: "경기도 성남시 중원구 둔촌대로 388 (상대원동, 크란츠 테크노), 1211호", addressEn: "1211 ho, 388, Dunchon-daero, Jungwon-gu, Seongnam-si, Gyeonggi-do, Republic of Korea", qty: 200 },
      { dept: "Sales", nameKr: "정승원", nameEn: "Jung Seung Won", titleKr: "과장", titleEn: "Sales Manager", phone: "010-4446-4827", email: "sw.jung@britzmedi.co.kr", tel: "070-4348-7244", fax: "070-4009-8993", website: "www.britzmedi.co.kr", addressKr: "경기도 성남시 중원구 둔촌대로 388 (상대원동, 크란츠 테크노), 1211호", addressEn: "1211 ho, 388, Dunchon-daero, Jungwon-gu, Seongnam-si, Gyeonggi-do, Republic of Korea", qty: 200 },
      { dept: "Sales", nameKr: "김경현", nameEn: "Kim Kyeong Hyeon", titleKr: "대리", titleEn: "Sales Assistant Manager", phone: "010-9393-9475", email: "kh.kim@britzmedi.co.kr", tel: "070-4348-7244", fax: "070-4009-8993", website: "www.britzmedi.co.kr", addressKr: "경기도 성남시 중원구 둔촌대로 388 (상대원동, 크란츠 테크노), 1211호", addressEn: "1211 ho, 388, Dunchon-daero, Jungwon-gu, Seongnam-si, Gyeonggi-do, Republic of Korea", qty: 400 }
    ];

    // ─── SVG Assets (Dynamic) ───
    function getSvgGradient(id) {
      const stops = currentTheme === 'white' 
        ? ['#8A7B4D', '#B8A978', '#D4C89A']
        : ['#D4C89A', '#EDE4C8', '#FFFFFF'];
      return `
        <linearGradient id="pg-${id}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="${stops[0]}"/>
          <stop offset="25%" stop-color="${stops[1]}"/>
          <stop offset="50%" stop-color="${stops[2]}"/>
          <stop offset="75%" stop-color="${stops[1]}"/>
          <stop offset="100%" stop-color="${stops[0]}"/>
        </linearGradient>`;
    }

    function makeLogo(w, h, id, raw = false) {
      const textFill = currentTheme === 'white' ? '#4A3D15' : '#B8A978';

    var VERSION = '1.6.0';

    function hardReset() {
      if (confirm("모든 데이터를 초기화하고 최신 [Stationery Builder] 디자인 가이드로 복구하시겠습니까?\n(기존에 저장된 명함 리스트가 삭제됩니다)")) {
        localStorage.clear();
        window.location.reload(true);
      }
    }

    function loadData() {
      const savedVersion = localStorage.getItem('britzmedi_version');
      if (savedVersion !== VERSION) {
        // Force update for new version to ensure layout fix
        localStorage.removeItem(STORAGE_KEY);
        localStorage.setItem('britzmedi_version', VERSION);
      }
      
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) { try { employees = JSON.parse(saved); } catch(e) { console.error("Load failed", e); } }
    }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(employees)); }
    function resetData() {
      if (confirm('모든 데이터를 초기화하고 기본 목록으로 되돌리시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
      }
    }


    function getThemeColors() {
      if (currentTheme === 'white') {
        return {
          bg: '#FFFFFF',
          nameKr: '#000000',
          titleKr: '#4A3D15',
          nameEn: '#222222',
          titleEn: '#333333',
          address: '#111111',
          highlight: '#403310',
          sub: '#222222',
          muted: '#444444',
          line: '#6A5D35',
          overlay: 'radial-gradient(ellipse at 80% 20%, rgba(168,153,104,0.08) 0%, transparent 60%)'
        };
      }
      return {
        bg: '#000000',
        nameKr: '#FFFFFF',
        titleKr: '#EDE4C8',
        nameEn: '#FFFFFF',
        titleEn: '#D4C89A',
        address: '#EDE4C8',
        highlight: '#FFFFFF',
        sub: '#EDE4C8',
        muted: '#D4C89A',
        line: '#EDE4C8',
        overlay: 'radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.03) 0%, transparent 50%)'
      };
    }

    // ─── Card Generators ───

    function frontCard(p, id, size) {
      const w = size === 'small' ? 370 : 540;
      const h = size === 'small' ? 212 : 310;
      const svgStr = buildFrontSVG(p, currentTheme, id)
        .replace('width="94mm" height="54mm"', `width="${w}" height="${h}"`);
      return `<div class="card-face" style="width:${w}px;height:${h}px;overflow:hidden;">${svgStr}</div>`;
    }

    function backCard(p, id, size) {
      const w = size === 'small' ? 370 : 540;
      const h = size === 'small' ? 212 : 310;
      const svgStr = buildBackSVG(p, currentTheme, id)
        .replace('width="94mm" height="54mm"', `width="${w}" height="${h}"`);
      return `<div class="card-face" style="width:${w}px;height:${h}px;overflow:hidden;">${svgStr}</div>`;
    }

    function envelopePreview(p, size_key, view) {
      const spec = ENVELOPE_SPECS[size_key];
      const scale = 1.6; // For screen preview
      const c = getThemeColors();
      
      const pxW = spec.w * scale;
      const pxH = spec.h * scale;
      const pxFlap = spec.flap * scale;
      const pxWing = spec.wing * scale;

      const isA4 = size_key === 'A4';
      const logoScale = isA4 ? 0.12 : 0.08;

      if (view === 'flat') {
        const totalW = (spec.w + spec.wing * 2) * scale;
        const totalH = (spec.h + spec.flap * 2) * scale;
        
        return `
          <div class="envelope-preview envelope-dieline-view" style="width:${totalW}px; height:${totalH}px; background:#f5f5f5; border:1px solid #ddd;">
            <svg width="100%" height="100%" viewBox="0 0 ${spec.w + spec.wing*2} ${spec.h + spec.flap*2}">
                ${generateEnvelopeSVGContent(p, size_key, true)}
            </svg>
          </div>`;
      }

      // Folded (Completed) View - Front Side
      return `
        <div class="envelope-preview" style="width:${pxW}px; height:${pxH+pxFlap}px; background:${c.bg};">
          <div class="card-bg-overlay" style="background:${c.overlay}; opacity:0.3"></div>
          
          <!-- Flap (Open look) -->
          <div style="width:100%; height:${pxFlap}px; background:${c.bg}; border-bottom:1px solid ${c.line}44; position:relative; overflow:hidden">
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">
                 <svg viewBox="500 500 1000 1000" style="height:${pxFlap*0.6}px; width:auto; opacity:0.4">
                    ${getLockupContent()}
                 </svg>
            </div>
          </div>

          <!-- Body -->
          <div style="padding:${isA4 ? '40px 50px' : '25px 35px'}; position:relative; height:${pxH}px">
             <!-- Sender Section (Top Left) -->
             <div style="margin-bottom:30px">
                <div style="display:flex; align-items:flex-start; gap:15px; margin-bottom:15px">
                   ${makeLogo(Math.round(40*scale*logoScale*8), Math.round(48*scale*logoScale*8), 'env-logo')}
                   <div style="margin-top:5px">
                      <div style="font-size:${isA4 ? 14 : 11}px; font-weight:600; color:${c.nameKr}; letter-spacing:1px">BRITZMEDI</div>
                      <div style="font-size:${isA4 ? 8 : 7}px; color:${c.titleKr}; opacity:0.8; letter-spacing:3px">AESTHETIC MEDICAL DEVICE</div>
                   </div>
                </div>
                <div style="font-size:${isA4 ? 10 : 8}px; color:${c.address}; line-height:1.6; font-weight:300; opacity:0.9">
                   ${p.addressKr}<br>
                   <span style="opacity:0.6">${p.addressEn}</span><br>
                   <span style="color:${c.highlight}; margin-top:5px; display:inline-block">T. ${p.tel} &nbsp; F. ${p.fax} &nbsp; www.britzmedi.co.kr</span>
                </div>
             </div>

             <!-- Receiver Guide (Center-Right Area) -->
             <div style="position:absolute; right:60px; top:55%; background:rgba(184,169,120,0.03); border:1px dashed ${c.line}44; width:${isA4 ? 280 : 200}px; height:${isA4 ? 100 : 70}px; display:flex; align-items:center; justify-content:center">
                <div style="font-size:10px; color:${c.muted}; letter-spacing:2px; font-weight:300">RECEIVER ADDRESS FIELD</div>
             </div>

             <!-- Postcode Box -->
             <div style="position:absolute; right:60px; bottom:60px; display:flex; gap:5px">
                ${[1,2,3,4,5].map(() => `<div style="width:25px; height:32px; border:1.5px solid ${c.line}55; border-radius:3px"></div>`).join('')}
             </div>
          </div>
        </div>`;
    }

    function generateEnvelopeSVGContent(p, size_key, includeDieline = false) {
        const spec = ENVELOPE_SPECS[size_key];
        const c = getThemeColors();
        const font = "'Noto Sans KR', sans-serif";
        const totalW = spec.w + spec.wing * 2;
        const totalH = spec.h + spec.flap * 2; // Bottom flap same as top for dieline

        let content = '';
        
        // 1. Dieline (칼선) - Only if in flat view mode or exporting dieline
        if (includeDieline) {
            content += `
                <!-- CUT LINES (BLACK) -->
                <path d="M${spec.wing},${spec.flap} 
                         h${spec.w} 
                         l${spec.wing},${spec.wing} v${spec.h - spec.wing*2} l-${spec.wing},${spec.wing} 
                         h-${spec.w} 
                         l-${spec.wing},-${spec.wing} v-${spec.h - spec.wing*2} l${spec.wing},-${spec.wing} Z" 
                      fill="none" stroke="#222" stroke-width="0.3" />
                
                <!-- TOP FLAP (Tapered) -->
                <path d="M${spec.wing},${spec.flap} 
                         l10,-${spec.flap} h${spec.w - 20} l10,${spec.flap} Z" 
                      fill="none" stroke="#222" stroke-width="0.3" />

                <!-- BOTTOM FLAP -->
                <path d="M${spec.wing},${totalH - spec.flap} 
                         l15,${spec.flap-10} h${spec.w - 30} l15,-${spec.flap-10} Z" 
                      fill="none" stroke="#222" stroke-width="0.3" />

                <!-- FOLD LINES (RED DASHED) -->
                <line x1="${spec.wing}" y1="${spec.flap}" x2="${spec.wing + spec.w}" y2="${spec.flap}" stroke="red" stroke-width="0.2" stroke-dasharray="2,2" />
                <line x1="${spec.wing}" y1="${spec.flap + spec.h}" x2="${spec.wing + spec.w}" y2="${spec.flap + spec.h}" stroke="red" stroke-width="0.2" stroke-dasharray="2,2" />
                <line x1="${spec.wing}" y1="${spec.flap}" x2="${spec.wing}" y2="${spec.flap + spec.h}" stroke="red" stroke-width="0.2" stroke-dasharray="2,2" />
                <line x1="${spec.wing + spec.w}" y1="${spec.flap}" x2="${spec.wing + spec.w}" y2="${spec.flap + spec.h}" stroke="red" stroke-width="0.2" stroke-dasharray="2,2" />
            `;
        }

        // 2. Main Content (Centered in dieline if dieline exists, otherwise at 0,0)
        const offset = includeDieline ? { x: spec.wing, y: spec.flap } : { x: 0, y: 0 };
        const isA4 = size_key === 'A4';

        content += `
            <g transform="translate(${offset.x}, ${offset.y})">
                <rect width="${spec.w}" height="${spec.h}" fill="${c.bg}" />
                
                <!-- Sender Info -->
                <g transform="translate(${isA4 ? 40 : 25}, ${isA4 ? 40 : 25})">
                    <g transform="scale(0.08)">
                        ${makeLogo(44, 52, 'env-logo-svg')}
                    </g>
                    <g transform="translate(60, 10)">
                        <text x="0" y="0" font-family="${font}" font-size="${isA4 ? 14 : 11}" font-weight="600" fill="${c.nameKr}">BRITZMEDI</text>
                        <text x="0" y="14" font-family="${font}" font-size="${isA4 ? 8 : 7}" fill="${c.titleKr}" letter-spacing="3">AESTHETIC MEDICAL DEVICE</text>
                    </g>
                    <g transform="translate(0, 70)">
                        <text x="0" y="0" font-family="${font}" font-size="${isA4 ? 10 : 8}" fill="${c.address}">${p.addressKr}</text>
                        <text x="0" y="16" font-family="${font}" font-size="${isA4 ? 8 : 7}" fill="${c.address}" opacity="0.6">${p.addressEn}</text>
                        <text x="0" y="32" font-family="${font}" font-size="${isA4 ? 9 : 7.5}" fill="${c.highlight}">T. ${p.tel} &nbsp; F. ${p.fax} &nbsp; www.britzmedi.co.kr</text>
                    </g>
                </g>

                <!-- Postcode Boxes -->
                <g transform="translate(${spec.w - (isA4 ? 200 : 160)}, ${spec.h - 60})">
                    ${[0, 30, 60, 90, 120].map(x => `<rect x="${x}" y="0" width="22" height="30" fill="none" stroke="${c.line}" stroke-width="1.2" rx="2" />`).join('')}
                </g>
            </g>
        `;

        return content;
    }

    function getLockupContent(noDefs) {
      const stops = currentTheme === 'white'
        ? ['#8A7B4D', '#B8A978', '#D4C89A']
        : ['#D4C89A', '#EDE4C8', '#FFFFFF'];
      const defs = noDefs ? '' : `
        <defs>
          <linearGradient id="pg_back" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${stops[0]}"/>
            <stop offset="25%" stop-color="${stops[1]}"/>
            <stop offset="50%" stop-color="${stops[2]}"/>
            <stop offset="75%" stop-color="${stops[1]}"/>
            <stop offset="100%" stop-color="${stops[0]}"/>
          </linearGradient>
        </defs>`;

      // Estimate text width for inline positioning (Korean × 0.95, A-Z × 0.72, a-z × 0.58, other × 0.55)
      function estW(text, fs) {
        var w = 0;
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          if (/[\uAC00-\uD7A3]/.test(ch)) w += fs * 0.95;
          else if (/[A-Z]/.test(ch)) w += fs * 0.72;
          else if (/[a-z]/.test(ch)) w += fs * 0.58;
          else w += fs * 0.55;
        }
        return w;
      }
      var titleKrX = Math.round(190 + estW(p.nameKr, 45) + 24);
      var titleEnX = Math.round(190 + estW(p.nameEn, 22) + 18);

  <rect width="940" height="540" fill="${c.bg}"/>
  <rect width="940" height="540" fill="url(#${ovlId})"/>
  <rect x="0" y="535" width="940" height="5" fill="url(#${bGId})"/>
  <rect x="12" y="12" width="916" height="516" fill="none" stroke="${trimColor}" stroke-width="1" stroke-dasharray="4,2"/>
  <g transform="translate(56,56) scale(0.07347) translate(-571,-466)">${logoRaw}</g>
  <text x="190" y="75" font-family="'Pretendard','Noto Sans KR',sans-serif" font-size="45" font-weight="600" fill="${c.nameKr}">${p.nameKr}</text>
  <text x="${titleKrX}" y="70" font-family="'Pretendard','Noto Sans KR',sans-serif" font-size="20" fill="${c.titleKr}" opacity="0.8">${p.titleKr}</text>
  <text x="190" y="107" font-family="'Pretendard','Noto Sans KR',sans-serif" font-size="22" fill="${c.nameEn}" opacity="0.9">${p.nameEn}</text>

  <rect x="56" y="322" width="59" height="2" fill="${c.line}" opacity="0.75"/>

</svg>`;
    }

    function buildBackSVG(p, theme, uid) {
      uid = uid || 'v';
      var isWhite = theme === 'white';

      var lockupScale = 250 / 1225;           // ≈ 0.2041
      var lockupW = 908 * lockupScale;        // ≈ 185.3

    // ─── Rendering ───

    function renderTabs() {
      const tabs = document.getElementById('personTabs');
      
      // Group by department
      const groups = {};
      employees.forEach((e, i) => {
        const d = e.dept || 'Etc';
        if (!groups[d]) groups[d] = [];
        groups[d].push({ ...e, originalIndex: i });
      });

      // Sort within group by rank
      Object.keys(groups).forEach(d => {
        groups[d].sort((a,b) => {
          const rA = RANK_ORDER[a.titleKr] || 99;
          const rB = RANK_ORDER[b.titleKr] || 99;
          return rA - rB;
        });
      });

      tabs.innerHTML = Object.keys(groups).sort().map(d => `
        <div class="dept-group">
          <div class="dept-label">${d}</div>
          <div class="tab-row">
            ${groups[d].map(e => `
              <button class="tab-btn ${e.originalIndex === currentPerson ? 'active' : ''}" onclick="selectPerson(${e.originalIndex})">
                <div style="font-weight:500; font-size:11px; margin-bottom:1px;">${e.nameKr}</div>
                <div style="font-size:8.5px; opacity:0.6;">${e.titleKr}</div>
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function renderPreview() {
      const p = employees[currentPerson];
      const mainPreview = document.getElementById('mainPreview');
      const envelopePreviewDiv = document.getElementById('envelopePreview');
      const designName = document.getElementById('designName');
      const designDesc = document.getElementById('designDesc');
      const printSpec = document.getElementById('printSpec');
      
      if (currentMode === 'card') {
          mainPreview.innerHTML = currentFace === 'front' ? frontCard(p, 'main-' + currentPerson, 'large') : backCard(p, 'main-' + currentPerson, 'large');
          designName.textContent = `${p.nameKr} — ${p.titleKr} / ${p.titleEn}`;
          designDesc.textContent = `${p.email} · ${p.phone} · 신청수량: ${p.qty}매`;
          printSpec.style.display = 'block';
      } else { // envelope mode
          envelopePreviewDiv.innerHTML = envelopePreview(p, currentEnvSize, currentEnvView);
          designName.textContent = `봉투 (${currentEnvSize}) — ${currentEnvView === 'fold' ? '완성형' : '칼선도면'}`;
          designDesc.textContent = `규격: ${ENVELOPE_SPECS[currentEnvSize].w}x${ENVELOPE_SPECS[currentEnvSize].h}mm (날개/접착면 제외)`;
          printSpec.style.display = 'none';
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.innerText.toLowerCase().includes(mode.toLowerCase()));
      });
      document.getElementById('cardPreviewSection').style.display = mode === 'card' ? 'block' : 'none';
      document.getElementById('envelopePreviewSection').style.display = mode === 'envelope' ? 'block' : 'none';
      renderAllCards(); // Re-render all cards to hide/show based on mode
      renderPreview();
    }

    function setEnvSize(size) {
      currentEnvSize = size;
      document.getElementById('env-a4').classList.toggle('active', size === 'A4');
      document.getElementById('env-dl').classList.toggle('active', size === 'DL');
      renderPreview();
    }

    function setEnvView(view) {
      currentEnvView = view;
      document.getElementById('face-fold').classList.toggle('active', view === 'fold');
      document.getElementById('face-flat').classList.toggle('active', view === 'flat');
      renderPreview();
    }

    function renderAllCards() {
      const grid = document.getElementById('allGrid');
      if (currentMode === 'envelope') {
        grid.innerHTML = '<div style="text-align:center; color:#555; padding:50px;">봉투 모드에서는 전체 미리보기를 제공하지 않습니다.</div>';
        return;
      }
      grid.innerHTML = employees.map((p, i) => `
        <div class="all-item" onclick="selectPerson(${i})">
          ${frontCard(p, 'all-f-' + i, 'small')}
          <div style="height:12px"></div>
          ${backCard(p, 'all-b-' + i, 'small')}
          <div class="all-label" style="color:${i === currentPerson ? '#D4C89A' : '#444'};font-weight:${i === currentPerson ? 600 : 400};margin-top:14px">
            ${p.nameKr} · ${p.titleKr}
          </div>
        </div>
      `).join('');
    }

    function selectPerson(idx) {
      currentPerson = idx;
      renderTabs();
      updatePreview();
      renderAllCards();
    }

    function setFace(face) {
      currentFace = face;
      document.getElementById('face-front').classList.toggle('active', face === 'front');
      document.getElementById('face-back').classList.toggle('active', face === 'back');
      renderPreview();
    }

    function setTheme(theme) {
      currentTheme = theme;
      document.getElementById('theme-black').classList.toggle('active', theme === 'black');
      document.getElementById('theme-white').classList.toggle('active', theme === 'white');
      renderPreview();
      renderAllCards();
    }

    // Initial render
    function init() {
      loadData();
      renderTabs();
      switchMode(currentMode); // Initialize UI based on currentMode
      setTheme(currentTheme); // Apply initial theme
      renderAllCards();
    }

    async function svgToCanvas(svgStr, w_mm, h_mm) {
      return new Promise((resolve) => {
        const mmToPx = 3.7795; // 1mm = 3.7795px
        const scale = 6.25; // 6.25 scale results in 600+ DPI (Professional Print Grade)
        
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(w_mm * mmToPx * scale); 
        canvas.height = Math.round(h_mm * mmToPx * scale);
        
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        
        // Ensure vector-like sharpness for text and paths
        ctx.textBaseline = 'top';
        ctx.fontKerning = 'normal';
        
        const img = new Image();
        const svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(svgBlob);
        
        img.onload = () => {
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas);
        };
        img.src = url;
      });
    }

    async function loadFont(doc) {
      try {
        const fontUrl = "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/public/static/Pretendard-Medium.ttf";
        const response = await fetch(fontUrl);
        const arrayBuffer = await response.arrayBuffer();
        
        // Use a more reliable way to convert ArrayBuffer to Base64 for large files
        const base64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.readAsDataURL(new Blob([arrayBuffer]));
        });

        doc.addFileToVFS('Pretendard.ttf', base64);
        doc.addFont('Pretendard.ttf', 'Pretendard', 'normal');
        return 'Pretendard';
      } catch(e) {
        console.warn("Font loading failed", e);
        return 'sans-serif';
      }
    }

    async function downloadCurrentPDF(event) {
      const btn = event.currentTarget;

      btn.innerHTML = '<span class="icon">⏳</span>'; btn.disabled = true;
      try {
        const { jsPDF } = window.jspdf;

        const generatePage = async (doc, isBack, fontName) => {
          const p = employees[currentPerson];
          const svgStr = currentMode === 'envelope'
            ? generateVectorSVG(p, isBack)
            : (isBack ? buildBackSVG(p, currentTheme) : buildFrontSVG(p, currentTheme));
          const parser = new DOMParser();
          const svgDoc = parser.parseFromString(svgStr, "image/svg+xml");
          const svgElement = svgDoc.documentElement;
          
          let w, h;
          if (currentMode === 'envelope') {
             const spec = ENVELOPE_SPECS[currentEnvSize];
             const isFlat = currentEnvView === 'flat';
             w = spec.w + (isFlat ? spec.wing * 2 : 0);
             h = spec.h + (isFlat ? spec.flap * 2 : 0);
          } else {
             w = 94; h = 54;
          }
          
          const c = getThemeColors();
          // Map hex to RGB for jsPDF solid fill
          const r = parseInt(c.bg.slice(1,3), 16);
          const g = parseInt(c.bg.slice(3,5), 16);
          const b = parseInt(c.bg.slice(5,7), 16);
          doc.setFillColor(r, g, b);
          doc.rect(0, 0, w, h, 'F');

          await doc.svg(svgElement, { 
            x: 0, y: 0, width: w, height: h,
            fontCallback: (family) => fontName
          });
        };

        const fontName = await loadFont(new jsPDF()); // Test instance to pre-load or just use the target

        if (currentMode === 'envelope') {
            const spec = ENVELOPE_SPECS[currentEnvSize];
            const isFlat = currentEnvView === 'flat';
            const w = spec.w + (isFlat ? spec.wing * 2 : 0);
            const h = spec.h + (isFlat ? spec.flap * 2 : 0);
            const pdf = new jsPDF({ orientation: w > h ? 'landscape' : 'portrait', unit:'mm', format:[w, h] });
            const finalFont = await loadFont(pdf);
            
            await generatePage(pdf, false, finalFont);
            pdf.save(`BRITZMEDI_Env_${currentEnvSize}_Vector_${employees[currentPerson].nameKr}.pdf`);
        } else {
            const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:[94, 54] });

            pdf.save(`BRITZMEDI_Card_Vector_${employees[currentPerson].nameKr}.pdf`);
        }
      } catch(e) { console.error(e); alert('PDF 생성 실패 (Vector Mode)'); }
      btn.innerHTML = origText; btn.disabled = false;
    }

    function downloadExcelTemplate() {
      const headers = ['부서', '이름(국문)', '이름(영문)', '직함(국문)', '직함(영문)', '휴대폰', '이메일', '전화', '팩스', '웹사이트', '주소(국문)', '주소(영문)', '수량'];

      const data = employees.map(p => [
        p.dept || '', p.nameKr, p.nameEn, p.titleKr, p.titleEn,
        p.phone, p.email, p.tel, p.fax, p.website,
        p.addressKr, p.addressEn, p.qty
      ]);

      const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
      ws['!cols'] = [
        {wch:12},{wch:12},{wch:20},{wch:14},{wch:30},
        {wch:16},{wch:24},{wch:16},{wch:16},{wch:20},
        {wch:40},{wch:60},{wch:8}
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '명함리스트');
      XLSX.writeFile(wb, 'BRITZMEDI_명함양식.xlsx');
    }

    function importExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const wb = XLSX.read(e.target.result, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1});

          if (rows.length < 1) return;
          const headers = rows[0];
          
          const findIdx = (keywords) => {
            return headers.findIndex(h => {
              const str = String(h || '').toLowerCase();
              return keywords.some(k => str.includes(k.toLowerCase()));
            });
          };

          const idx = {
            dept: findIdx(['부서', 'dept']),
            nameKr: findIdx(['이름(국문)', '성명(국문)', 'name(kr)']),
            nameEn: findIdx(['이름(영문)', '성명(영문)', 'name(en)']),
            titleKr: findIdx(['직함(국문)', '직위(국문)', 'title(kr)']),
            titleEn: findIdx(['직함(영문)', '직위(영문)', 'title(en)']),
            phone: findIdx(['휴대폰', '핸드폰', 'mobile', 'cell']),
            email: findIdx(['이메일', 'email']),
            tel: findIdx(['전화', '직통', 'tel']),
            fax: findIdx(['팩스', 'fax']),
            website: findIdx(['웹사이트', '커뮤니티', 'web', 'site']),
            addrKr: findIdx(['주소(국문)', 'addr(kr)']),
            addrEn: findIdx(['주소(영문)', 'addr(en)']),
            qty: findIdx(['수량', 'qty'])
          };

          const newEmployees = [];
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            if (!r || r.length === 0) continue;

            let rowNameKr = idx.nameKr !== -1 ? String(r[idx.nameKr] || '').trim() : '';
            let rowNameEn = idx.nameEn !== -1 ? String(r[idx.nameEn] || '').trim() : '';
            
            if (!rowNameKr && !rowNameEn) continue; 
            if (!rowNameKr) rowNameKr = rowNameEn;

            newEmployees.push({
              dept: idx.dept !== -1 ? String(r[idx.dept] || 'Etc').trim() : 'Etc',
              nameKr: rowNameKr,
              nameEn: rowNameEn,
              titleKr: idx.titleKr !== -1 ? String(r[idx.titleKr] || '').trim() : '',
              titleEn: idx.titleEn !== -1 ? String(r[idx.titleEn] || '').trim() : '',
              phone: idx.phone !== -1 ? String(r[idx.phone] || '').trim() : '',
              email: idx.email !== -1 ? String(r[idx.email] || '').trim() : '',
              tel: idx.tel !== -1 ? String(r[idx.tel] || '').trim() : '',
              fax: idx.fax !== -1 ? String(r[idx.fax] || '').trim() : '',
              website: idx.website !== -1 ? String(r[idx.website] || '').trim() : '',
              addressKr: idx.addrKr !== -1 ? String(r[idx.addrKr] || '').trim() : '',
              addressEn: idx.addrEn !== -1 ? String(r[idx.addrEn] || '').trim() : '',
              qty: idx.qty !== -1 ? Number(r[idx.qty]) || 200 : 200
            });
          }

          if (newEmployees.length === 0) {
            alert('유효한 명함 데이터(이름 등)를 찾을 수 없습니다. 새로운 엑셀 양식을 다운로드하여 작성해 주세요.');
            return;
          }

          employees.length = 0;
          newEmployees.forEach(function(emp) { employees.push(emp); });
          saveData();
          currentPerson = 0;
          currentFace = 'front';
          renderTabs();
          renderPreview();
          renderAllCards();
          alert(`${newEmployees.length}명의 명함이 불러와졌으며 자동으로 저장되었습니다.`);
        } catch(err) {
          console.error(err);
          alert('엑셀 파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }
